<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-accent="coral">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<!-- token da sessao: injetado pelo servidor a cada inicializacao -->
<meta name="panel-token" content="__PANEL_TOKEN__">
<title>Config Celular</title>

<link rel="stylesheet" href="/app/styles/tokens.css">
<link rel="stylesheet" href="/app/styles/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23d97757'/%3E%3Crect x='8' y='4' width='8' height='16' rx='2' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='17.5' r='.9' fill='%23fff'/%3E%3C/svg%3E">

<style>
  /* tela de carregamento: some assim que o main.js monta o shell */
  #boot {
    position: fixed; inset: 0; z-index: 999;
    display: grid; place-items: center; gap: 14px;
    background: var(--bg, #16181d); color: var(--text-dim, #9aa3af);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    transition: opacity .25s ease;
  }
  #boot .mark {
    width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(140deg, #e08a6e, #bf5f3a);
    display: grid; place-items: center;
  }
  #boot .ring {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: bootspin .7s linear infinite;
  }
  @keyframes bootspin { to { transform: rotate(360deg); } }
  body:has(#app) #boot { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="boot" aria-hidden="true">
  <div class="mark"><span class="ring"></span></div>
  <div>Iniciando o painel...</div>
</div>

<noscript>
  <div style="padding:32px;font-family:Segoe UI,sans-serif;color:#e8eaed">
    <h1>JavaScript desativado</h1>
    <p>O painel precisa de JavaScript para conversar com o servidor local.</p>
  </div>
</noscript>

<script type="module" src="/app/main.js"></script>
</body>
</html>
